name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

# DO NOT CREATE ISSUES FOR THIS
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    env:
      SEARXNG_URL: http://127.0.0.1:8888

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install just
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: just@1.51.0
          fallback: none

      - name: Setup SearXNG test server
        working-directory: searxng-server-test
        run: bash 00-setup.sh

      - name: Start SearXNG (background)
        working-directory: searxng-server-test
        run: bash 01-start-bg.sh

      - name: Build binary
        run: just build

      # Used to try increase success rate for the E2E
      - name: Connect Cloudflare WARP
        env:
          WG_CONFIG: ${{ secrets.CFWARP_CONFIG }}
        run: |
          sudo apt-get update && sudo apt-get install wireguard-tools -y
          sudo mkdir -p /etc/wireguard
          sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          echo "WARNING! Runner log will stop updating after connection established, wait the disconnect step done and it should show up again."
          sudo wg-quick up wg0

      # wretry.action rationale: upstream search engines (Google, Bing, etc.)
      # probabilistically rate-limit or ban the CI SearXNG instance during
      # automated E2E runs. This is not a code or SearXNG bug — it is inherent
      # to meta-search against live third-party engines. The retry wrapper
      # retries the full test run to land on a clean window where no engine is
      # throttling us.
      # Library-level retry (SEARXNG_MAX_RETRIES=2) covers single-request
      # flakes; CI-level retry covers whole-instance throttling.
      # attempt_limit=3: empirically sufficient for CI. Worst case:
      # 3 × (600s + 10s) ≈ 30 min, well within the default job timeout.
      - name: E2E test — MCP stdio (with retry)
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        env:
          E2E_MCP_BINARY: ./searxng-mcp-go
        with:
          command: just test-e2e-mcp
          attempt_limit: 3
          attempt_delay: 10000 # 10 s (ms)
        #  time_out: 900000           # 900 s = 15 min (ms) : caused continued waiting after success

      # Same wretry rationale as the MCP stdio step above (upstream engine
      # throttling requires multiple attempts to find a clean window).
      # CLI smoke: replaces the previous shell grep / python3 smoke steps.
      # Live-server assertions live in Go E2E (TestCLISmoke) so they share
      # the WARNING SUMMARY pattern; shell steps are limited to deterministic
      # exit-code checks that do not depend on a live response.
      # See AGENTS.md "E2E Tests" for the hard rule.
      - name: E2E test — CLI smoke (with retry)
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        env:
          E2E_MCP_BINARY: ./searxng-mcp-go
        with:
          command: just test-e2e-cli-smoke
          attempt_limit: 3
          attempt_delay: 10000 # 10 s (ms)

      - name: E2E test — empty query fails
        run: |
          if ./searxng-mcp-go "" 2>/dev/null; then
            echo "FAIL: empty query should exit with code 1"
            exit 1
          fi
          echo "OK: empty query correctly exited with code 1"

      - name: Disconnect Wireguard so runner log can work
        if: always()
        run: |
          sudo wg-quick down wg0
          echo "Sleeping 10 sec"
          sleep 10

      - name: Cleanup
        if: always()
        working-directory: searxng-server-test
        run: just test-server-stop
