name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    env:
      SEARXNG_URL: http://127.0.0.1:8888

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Setup SearXNG test server
        working-directory: searxng-server-test
        run: bash 00-setup.sh

      - name: Start SearXNG (background)
        working-directory: searxng-server-test
        run: bash 01-start-bg.sh

      - name: Build binary
        run: go build -o searxng-mcp-go .

      - name: E2E test — MCP stdio (with retry)
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        env:
          E2E_MCP_BINARY: ./searxng-mcp-go
        with:
          command: go test -v -tags=e2e -run 'TestMCP' -count=1 -timeout=600s .
          attempt_limit: 10
          attempt_delay: 10000 # 10 s (ms)
        #  time_out: 900000           # 900 s = 15 min (ms) : caused continued waiting after success

      # CLI smoke: replaces the previous shell grep / python3 smoke steps.
      # Live-server assertions live in Go E2E (TestCLISmoke) so they share
      # the WARNING SUMMARY pattern; shell steps are limited to deterministic
      # exit-code checks that do not depend on a live response.
      # See AGENTS.md "E2E Tests" for the hard rule.
      - name: E2E test — CLI smoke (with retry)
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        env:
          E2E_MCP_BINARY: ./searxng-mcp-go
        with:
          command: go test -v -tags=e2e -run 'TestCLISmoke' -count=1 -timeout=600s .
          attempt_limit: 10
          attempt_delay: 10000 # 10 s (ms)

      - name: E2E test — empty query fails
        run: |
          if ./searxng-mcp-go "" 2>/dev/null; then
            echo "FAIL: empty query should exit with code 1"
            exit 1
          fi
          echo "OK: empty query correctly exited with code 1"

      - name: Cleanup
        if: always()
        working-directory: searxng-server-test
        run: |
          if [ -f .bg-pid ]; then
            kill "$(cat .bg-pid)" 2>/dev/null || true
            rm -f .bg-pid
            echo "SearXNG stopped"
          fi
