name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.3"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Setup SearXNG test server
        working-directory: searxng-server-test
        run: bash 00-setup.sh

      - name: Start SearXNG (background)
        working-directory: searxng-server-test
        run: bash 01-start-bg.sh

      - name: Build binary
        run: go build -o searxng-mcp-go .

      - name: E2E test — basic query
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go "golang tutorial" 2>&1)
          echo "$output"
          echo "$output" | grep -q "Results"

      - name: E2E test — JSON output
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go --json "golang" 2>&1)
          echo "$output"
          python3 -c "import sys,json; d=json.loads(sys.stdin.read()); assert 'query' in d" <<< "$output"

      - name: E2E test — empty query fails
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          if ./searxng-mcp-go "" 2>/dev/null; then
            echo "FAIL: empty query should exit with code 1"
            exit 1
          fi
          echo "OK: empty query correctly exited with code 1"

      - name: E2E test — sha512 answer
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go "sha512 hello" 2>&1)
          echo "$output"
          echo "$output" | grep -q "Answers"
          echo "$output" | grep -Eq "[[:xdigit:]]{64,}"

      - name: E2E test — IP answer
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go "ip" 2>&1)
          echo "$output"
          echo "$output" | grep -q "Answers"
          echo "$output" | grep -Eq "([0-9]{1,3}\.){3}[0-9]{1,3}"

      - name: E2E test — random UUID answer
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go "random uuid" 2>&1)
          echo "$output"
          echo "$output" | grep -q "Answers"
          echo "$output" | grep -Eiq "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"

      - name: E2E test — Berlin time answer
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go "time Berlin" 2>&1)
          echo "$output"
          echo "$output" | grep -q "Answers"
          echo "$output" | grep -Eiq "Berlin|[0-9]{1,2}:[0-9]{2}"

      - name: E2E test — average answer
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go "avg 1 2 3 4 5" 2>&1)
          echo "$output"
          echo "$output" | grep -q "Answers"
          echo "$output" | grep -Eq "^\[1\] 3(\.0+)?$"

      - name: E2E test — infobox JSON output
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go --json "apple inc" 2>&1)
          echo "$output"
          python3 -c "import sys,json; d=json.loads(sys.stdin.read()); assert isinstance(d.get('infoboxes'), list) and d['infoboxes']" <<< "$output"

      - name: E2E test — language parameter
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go --language zh-tw "測試" 2>&1)
          echo "$output"
          echo "$output" | grep -Eq "Results|No results found"

      - name: E2E test — time range parameter
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go --time_range year "golang" 2>&1)
          echo "$output"
          echo "$output" | grep -Eq "Results|No results found"

      - name: E2E test — categories parameter
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go --categories news "news" 2>&1)
          echo "$output"
          echo "$output" | grep -Eq "Results|No results found"

      - name: E2E test — long query
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          query="golang $(printf 'search %.0s' {1..35})"
          output=$(./searxng-mcp-go "$query" 2>&1)
          echo "$output"
          echo "$output" | grep -Eq "Results|No results found"

      - name: E2E test — strict safesearch parameter
        env:
          SEARXNG_URL: http://127.0.0.1:8888
        run: |
          output=$(./searxng-mcp-go --safesearch 2 "test" 2>&1)
          echo "$output"
          echo "$output" | grep -Eq "Results|No results found"

      - name: Cleanup
        if: always()
        working-directory: searxng-server-test
        run: |
          if [ -f .bg-pid ]; then
            kill "$(cat .bg-pid)" 2>/dev/null || true
            rm -f .bg-pid
            echo "SearXNG stopped"
          fi
