name: E2E Stress

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-stress:
    name: End-to-End Stress
    runs-on: ubuntu-latest
    env:
      SEARXNG_URL: http://127.0.0.1:8888

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Setup SearXNG test server
        working-directory: searxng-server-test
        run: bash 00-setup.sh

      - name: Start SearXNG background
        working-directory: searxng-server-test
        run: bash 01-start-bg.sh

      - name: Install just
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: just@1.51.0
          fallback: none

      - name: Build binary
        run: go build -o searxng-mcp-go .

      - name: E2E stress test
        env:
          E2E_MCP_BINARY: ./searxng-mcp-go
        run: go test -v -tags='e2e stress' -run 'TestMCPStress' -race -count=1 -timeout=900s .

      - name: Cleanup
        if: always()
        working-directory: searxng-server-test
        run: just test-server-stop
