name: E2E Stress

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-stress:
    name: End-to-End Stress
    runs-on: ubuntu-latest
    env:
      SEARXNG_URL: http://127.0.0.1:8888

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Setup SearXNG test server
        working-directory: searxng-server-test
        run: bash 00-setup.sh

      - name: Start SearXNG background
        working-directory: searxng-server-test
        run: bash 01-start-bg.sh

      - name: Install just
        uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: just@1.51.0
          fallback: none

      - name: Build binary
        run: go build -o searxng-mcp-go .

      - name: E2E stress test
        env:
          E2E_MCP_BINARY: ./searxng-mcp-go
        run: go test -v -tags='e2e stress' -run 'TestMCPStress' -count=1 -timeout=900s .

      - name: Cleanup
        if: always()
        working-directory: searxng-server-test
        run: just test-server-stop
