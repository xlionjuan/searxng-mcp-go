name: E2E Stress

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-stress:
    name: End-to-End Stress
    runs-on: ubuntu-latest
    env:
      SEARXNG_URL: http://127.0.0.1:8888

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup SearXNG test server
        working-directory: searxng-server-test
        run: bash 00-setup.sh

      - name: Start SearXNG background
        working-directory: searxng-server-test
        run: bash 01-start-bg.sh

      - name: Install just
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: just@1.51.0
          fallback: none

      - name: Build binary
        run: just build

      - name: E2E stress test
        env:
          E2E_MCP_BINARY: ./searxng-mcp-go
        run: just test-e2e-stress

      - name: Cleanup
        if: always()
        working-directory: searxng-server-test
        run: just test-server-stop
