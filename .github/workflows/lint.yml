name: Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true

      - name: Check all setup-go blocks have cache: true
        run: |
          errors=0
          for f in .github/workflows/*.yml; do
            for line_num in $(grep -n "uses: actions/setup-go" "$f" | cut -d: -f1); do
              if ! sed -n "$((line_num+1)),$((line_num+10))p" "$f" | grep -q 'cache: true'; then
                echo "FAIL: $f:$line_num is missing cache: true"
                errors=$((errors + 1))
              fi
            done
          done
          if [ "$errors" -gt 0 ]; then exit 1; fi
          echo "OK: all actions/setup-go blocks have cache: true"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          install-only: true

      - name: golangci-lint
        run: golangci-lint run --timeout 5m

      - name: golangci-lint (stress build tag)
        run: golangci-lint run --timeout 5m --build-tags=stress

      - name: golangci-lint (e2e build tag)
        run: golangci-lint run --timeout 5m --build-tags=e2e

      - name: Check formatting (gofumpt / goimports / gci)
        run: golangci-lint fmt --diff
