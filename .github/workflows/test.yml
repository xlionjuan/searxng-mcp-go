name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -o searxng-mcp-go .

      # PGO is intentionally not enabled; see docs/adr/001-no-pgo.md (ADR-001).

      - name: Run tests
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        env:
          COVERAGE_THRESHOLD: "70"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          if [ -z "$total" ]; then
            echo "Could not determine total coverage"
            exit 1
          fi
          echo "Total coverage: ${total}%"
          awk -v total="$total" -v threshold="$COVERAGE_THRESHOLD" 'BEGIN {
            if (total + 0 < threshold + 0) {
              printf "Coverage %.2f%% < %.2f%%\n", total, threshold
              exit 1
            }
          }'

      - name: Stress tests
        run: go test -race -tags=stress -shuffle=on ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

  codecov:
    name: Upload coverage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: .

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          disable_search: true
          fail_ci_if_error: true
          slug: xlionjuan/searxng-mcp-go
          use_oidc: true
