name: Shellcheck
on:
  push:
    branches: [main]
    paths:
      - 'searxng-server-test/*.sh'
  pull_request:
    paths:
      - 'searxng-server-test/*.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck-and-pid-helper:
    name: Shellcheck & PID Helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on test-server scripts
        run: shellcheck --severity=error searxng-server-test/*.sh
      - name: Install just
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: just@1.51.0
          fallback: none
      - name: Run PID helper tests
        run: just test-server-pid-helper
