name: Shellcheck
on:
  push:
    branches: [main]
    paths:
      - 'searxng-server-test/*.sh'
  pull_request:
    paths:
      - 'searxng-server-test/*.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck-and-pid-helper:
    name: Shellcheck & PID Helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on test-server scripts
        run: shellcheck --severity=error searxng-server-test/*.sh
      - name: Install just
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: just@1.51.0
          fallback: none
      - name: Run PID helper tests
        run: just test-server-pid-helper
