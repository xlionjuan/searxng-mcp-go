version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: all
  disable:
    - gochecknoglobals
    - godox
    - nestif
    - wrapcheck
    - wsl
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - main.go
            - cli.go
            - mcp.go
            - testhelpers.go
          allow:
            - $gostd
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "searxng-mcp-go/internal/searxng"
          deny:
            - pkg: "net/http"
              desc: "Use internal client wrapper instead"
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    interfacebloat:
      max: 10
    lll:
      line-length: 140
    misspell:
      locale: US
    nakedret:
      max-func-lines: 5
    funlen:
      lines: 100
      statements: 60
    varnamelen:
      min-name-length: 2
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters: [exhaustruct]
        paths:
          - ".*_test\\.go$"
        text: ".*"
      - linters: [forbidigo]
        paths:
          - "cli\\.go$"
        text: ".*"
      - linters: [funlen]
        paths:
          - ".*_test\\.go$"
        text: ".*"
      - linters: [gosmopolitan]
        paths:
          - ".*_test\\.go$"
        text: ".*"
      - linters: [tagliatelle]
        paths:
          - "internal/searxng/types\\.go$"
        text: "json\\(camel\\): got '(time_range|feels_like|wind_from|wind_speed|cloud_cover|country_code|number_of_results|unresponsive_engines)'"
      - linters: [paralleltest]
        paths:
          - "error_path_test\\.go$"
        text: ".*"
      - linters: [paralleltest]
        paths:
          - "golden_capture_test\\.go$"
        text: ".*"
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new-from-rev: main
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
