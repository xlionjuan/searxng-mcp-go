version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: all
  disable:
    - gochecknoglobals
    - godox
    - gomodguard
    - nestif
    - wrapcheck
    - wsl
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - main.go
            - cli.go
            - mcp.go
            - testhelpers.go
          allow:
            - $gostd
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "searxng-mcp-go/internal/searxng"
          deny:
            - pkg: "net/http"
              desc: "Use internal client wrapper instead"
    dupl:
      threshold: 100
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 13
    govet:
      enable:
        - shadow
    interfacebloat:
      max: 10
    lll:
      line-length: 140
    misspell:
      locale: US
    nakedret:
      max-func-lines: 5
    funlen:
      lines: 100
      statements: 60
    varnamelen:
      min-name-length: 2
    nolintlint:
      require-specific: true
      require-explanation: true
    errcheck:
      check-type-assertions: true
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters: [exhaustruct]
        paths:
          - ".*_test\\.go$"
        text: ".*"
      - linters: [forbidigo]
        paths:
          - "cli\\.go$"
        text: ".*"
      - linters: [funlen]
        paths:
          - ".*_test\\.go$"
        text: ".*"
      - linters: [dupl]
        paths:
          - ".*_test\\.go$"
        text: ".*"
      - linters: [gosmopolitan]
        paths:
          - ".*_test\\.go$"
        text: ".*"
      - linters: [tagliatelle]
        paths:
          - "internal/searxng/types\\.go$"
        text: "json\\(camel\\): got '(time_range|feels_like|wind_from|wind_speed|cloud_cover|country_code|number_of_results|unresponsive_engines)'"
      - linters: [paralleltest]
        paths:
          - "error_path_test\\.go$"
        text: ".*"
      - linters: [paralleltest]
        paths:
          - "golden_capture_test\\.go$"
        text: ".*"
      - linters: [revive]
        paths:
          - "internal/searxng/(errors|searcher)\\.go$"
        text: "exported: type name will be used as searxng\\.(SearXNGError|SearXNGSearcher)"
      - linters: [goconst]
        paths:
          - ".*_test\\.go$"
        text: ".*"
      - linters: [varnamelen]
        paths:
          - ".*_test\\.go$"
        text: ".*"

issues:
  max-issues-per-linter: 0
  max-same-issues: 10
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(searxng-mcp-go)
    gofumpt:
      extra-rules: true
      module-path: searxng-mcp-go
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
