version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: all
  disable:
    - errchkjson
    - errorlint
    - gochecknoglobals
    - godox
    - nestif
    - wrapcheck
    - wsl
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - main.go
            - cli.go
            - mcp.go
            - testhelpers.go
          allow:
            - $gostd
            - "github.com/modelcontextprotocol/go-sdk/mcp"
            - "searxng-mcp-go/internal/searxng"
          deny:
            - pkg: "net/http"
              desc: "Use internal client wrapper instead"
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    interfacebloat:
      max: 10
    lll:
      line-length: 140
    misspell:
      locale: US
    nakedret:
      max-func-lines: 5
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new-from-rev: main
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - third_party$
      - builtin$
      - examples$
