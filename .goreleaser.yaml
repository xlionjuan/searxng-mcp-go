# .goreleaser.yaml
version: 2

project_name: searxng-mcp-go

before:
  hooks:
    - go mod tidy

builds:
  - id: searxng-mcp-go
    main: .
    binary: searxng-mcp-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    tags:
      - netgo
      - osusergo
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: xlionjuan
    name: searxng-mcp-go
  prerelease: auto
  make_latest: true

homebrew_casks:
  - name: searxng-mcp-go
    repository:
      owner: xlionjuan
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/xlionjuan/searxng-mcp-go"
    description: "SearXNG MCP Server — web search via Meta Search Engine"
    license: "AGPL-3.0"
    binaries:
      - searxng-mcp-go
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    skip_upload: auto
